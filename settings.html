<div class="__wr_settings" data-extension-name="water-reminder">
<style>
/* ===== 极简风：无多余底色，仅用边框/留白分隔 ===== */
.__wr_settings .__wr_section{margin:12px 0;}
.__wr_settings .__wr_section:last-child{margin-bottom:0;}
.__wr_settings .__wr_label{
  display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:var(--SmartThemeWeakTextColor,rgba(255,255,255,.5));margin-bottom:8px;
}

/* --- Toggle 开关（无底色，仅边框） --- */
.__wr_settings .__wr_switch-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;margin-bottom:12px;
}
.__wr_settings .__wr_switch-row label[for="__wrEnabled"]{
  font-size:13px;color:var(--SmartThemeEmColor,#fff);
}
.__wr_settings .__wr_switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.__wr_settings .__wr_switch input{opacity:0;width:0;height:0;}
.__wr_settings .__wr_slider{
  position:absolute;inset:0;background:rgba(128,128,128,.35);
  border-radius:22px;cursor:pointer;transition:.25s;
}
.__wr_settings .__wr_slider::before{
  content:"";position:absolute;height:18px;width:18px;left:2px;top:2px;
  background:#fff;border-radius:50%;transition:.25s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.__wr_settings .__wr_switch input:checked + .__wr_slider{
  background:var(--SmartThemeAccentColor,#0a84ff);
}
.__wr_settings .__wr_switch input:checked + .__wr_slider::before{transform:translateX(18px);}

/* --- Radio 预设按钮 --- */
.__wr_settings .__wr_radio-row{display:flex;gap:6px;flex-wrap:wrap;}
.__wr_settings .__wr_radio-row label{
  display:inline-flex;align-items:center;font-size:12px;font-weight:500;
  cursor:pointer;padding:5px 12px;border-radius:6px;
  border:1px solid var(--SmartThemeBorderColor,rgba(255,255,255,.15));
  background:transparent;
  color:var(--SmartThemeEmColor,#fff);
  transition:.15s;
}
.__wr_settings .__wr_radio-row label:hover{
  border-color:var(--SmartThemeAccentColor,#0a84ff);
}
.__wr_settings .__wr_radio-row label.selected{
  border-color:var(--SmartThemeAccentColor,#0a84ff);
  color:var(--SmartThemeAccentColor,#0a84ff);
}
.__wr_settings .__wr_radio-row input{display:none;}

/* --- 自定义输入 --- */
.__wr_settings .__wr_custom-row{display:none;gap:5px;align-items:center;margin-top:6px;font-size:12px;color:var(--SmartThemeWeakTextColor,rgba(255,255,255,.5));}
.__wr_settings .__wr_custom-row.show{display:flex;}
.__wr_settings .__wr_custom-row input{
  width:56px;padding:4px 8px;
  background:transparent;
  border:1px solid var(--SmartThemeBorderColor,rgba(255,255,255,.15));
  border-radius:6px;color:var(--SmartThemeEmColor,#fff);
  font-size:13px;text-align:center;
}
.__wr_settings .__wr_custom-row input:focus{
  border-color:var(--SmartThemeAccentColor,#0a84ff);outline:none;
}

/* --- Select --- */
.__wr_settings .__wr_select{
  padding:6px 10px;
  background:transparent;
  border:1px solid var(--SmartThemeBorderColor,rgba(255,255,255,.15));
  border-radius:6px;color:var(--SmartThemeEmColor,#fff);
  font-size:12px;min-width:160px;cursor:pointer;
}
.__wr_settings .__wr_select:focus{
  border-color:var(--SmartThemeAccentColor,#0a84ff);outline:none;
}

/* --- 按钮 --- */
.__wr_settings .__wr_test-row{display:flex;gap:6px;margin-top:8px;}
.__wr_settings .__wr_btn{
  padding:6px 12px;
  background:var(--SmartThemeAccentColor,#0a84ff);
  color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;
  transition:.15s;
}
.__wr_settings .__wr_btn:hover{filter:brightness(1.1);}
.__wr_settings .__wr_btn.secondary{
  background:transparent;
  border:1px solid var(--SmartThemeBorderColor,rgba(255,255,255,.2));
  color:var(--SmartThemeEmColor,#fff);
}
.__wr_settings .__wr_btn.secondary:hover{
  border-color:var(--SmartThemeAccentColor,#0a84ff);
  color:var(--SmartThemeAccentColor,#0a84ff);
}

/* --- 倒计时（无底色！仅文字） --- */
.__wr_settings .__wr_countdown{
  text-align:center;padding:10px 0;
  border-top:1px dashed var(--SmartThemeBorderColor,rgba(255,255,255,.1));
  border-bottom:1px dashed var(--SmartThemeBorderColor,rgba(255,255,255,.1));
  font-size:11px;color:var(--SmartThemeWeakTextColor,rgba(255,255,255,.4));
  margin:8px 0;
}
.__wr_settings .__wr_countdown .time{
  font-size:22px;font-weight:700;letter-spacing:1px;
  color:var(--SmartThemeAccentColor,#0a84ff);
  display:block;margin-top:2px;font-variant-numeric:tabular-nums;
}
</style>

<div class="inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b>💧 喝水提醒</b>
    <span id="__wrStatus" style="margin-left:8px;font-size:11px;color:var(--SmartThemeWeakTextColor,rgba(255,255,255,.5));"></span>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
  </div>
  <div class="inline-drawer-content">
    <div class="__wr_switch-row">
      <label for="__wrEnabled">启用提醒</label>
      <label class="__wr_switch"><input type="checkbox" id="__wrEnabled"><span class="__wr_slider"></span></label>
    </div>
    <div class="__wr_section">
      <div class="__wr_label">提醒间隔</div>
      <div class="__wr_radio-row">
        <label><input type="radio" name="wrInterval" value="30">30 分钟</label>
        <label><input type="radio" name="wrInterval" value="60">1 小时</label>
        <label><input type="radio" name="wrInterval" value="0">自定义</label>
      </div>
      <div class="__wr_custom-row" id="__wrCustomRow">
        <span>每</span>
        <input type="number" id="__wrCustomMin" min="5" max="360" step="10">
        <span>分钟</span>
      </div>
    </div>
    <div class="__wr_section">
      <div class="__wr_label">提醒方式</div>
      <select class="__wr_select" id="__wrAlertMode">
        <option value="tritone">Tri-Tone（三声叮）</option>
        <option value="rebound">Rebound（弹跳音）</option>
        <option value="vibrate">手机震动</option>
        <option value="tritone+vibrate">Tri-Tone + 震动</option>
        <option value="rebound+vibrate">Rebound + 震动</option>
        <option value="silent">只看 Toast（静默）</option>
      </select>
      <div style="font-size:11px;color:var(--SmartThemeWeakTextColor,rgba(255,255,255,.4));margin-top:6px;">💡 震动仅支持 Android 浏览器</div>
      <div class="__wr_test-row">
        <button class="__wr_btn secondary" id="__wrTestAlert">🔊 试听一下</button>
      </div>
    </div>
    <div class="__wr_section">
      <div class="__wr_countdown">
        下次提醒还有<span class="time" id="__wrCount">--:--</span>
      </div>
      <div class="__wr_test-row">
        <button class="__wr_btn" id="__wrDrinkNow">✅ 我刚喝了水</button>
      </div>
    </div>
  </div>
</div>
</div>
